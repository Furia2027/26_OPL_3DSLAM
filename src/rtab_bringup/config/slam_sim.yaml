slam_toolbox:
  ros__parameters:
    # Solver settings
    use_sim_time: true
    solver_plugin: solver_plugins::CeresSolver
    ceres_linear_solver: SPARSE_NORMAL_CHOLESKY
    ceres_preconditioner: SCHUR_JACOBI
    ceres_trust_strategy: LEVENBERG_MARQUARDT

    # Frames and Topics
    odom_frame: odom
    map_frame: map
    base_frame: base_footprint
    scan_topic: /scan
    mode: navigation

    # Map & Graph Update Spacing
    map_update_interval: 0.5
    minimum_time_interval: 0.1
    minimum_travel_distance: 0.15     # Reduced from 0.3 for denser graph nodes
    minimum_travel_heading: 0.15      # Reduced from 0.3 (~8.5 degrees)
    transform_publish_period: 0.02
    transform_timeout: 0.2            # Prevents simulation TF lookup failures
    throttle_scans: 1
    max_laser_range: 11.0             # Leverages 12m Gazebo range safely
    scan_queue_size: 15
    resolution: 0.05

    # Scan Matching & Correlation
    use_scan_matching: true
    use_scan_barycenter: true
    correlation_search_space_dimension: 0.5
    correlation_search_space_resolution: 0.01
    correlation_search_space_smear_deviation: 0.1

    # Anti-Jump & Loop Closure Tuning
    loop_search_maximum_distance: 1.5
    minimum_response_fine: 0.3
    link_match_minimum_response_fine: 0.3
    loop_match_minimum_response_coarse: 0.6
    loop_match_minimum_response_fine: 0.7
    loop_match_minimum_chain_size: 15

    # Odometry Trust Penalties
    distance_variance_penalty: 1.0
    angle_variance_penalty: 1.5

    fine_search_angle_offset: 0.00349
    coarse_search_angle_offset: 0.349
    coarse_angle_resolution: 0.0349
    minimum_angle_penalty: 0.9
    minimum_distance_penalty: 0.5
    use_response_expansion: true
